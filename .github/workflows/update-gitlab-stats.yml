name: Update GitLab Stats

on:
  schedule:
    - cron: '0 0 * * *' # Ejecutar cada 24hs
  workflow_dispatch:      # Botón para ejecutar manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso vital para guardar la imagen
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Generate SVG
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        # 👇 AQUÍ ESTABA EL ERROR. Ahora apunta a tu archivo real:
        run: python gitlab-stats.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gitlab-stats.svg
          git commit -m "🔥 Update GitLab Stats" || exit 0
          git push
